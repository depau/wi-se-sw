{# This file generates platformio.ini. This is the file you need to edit if you would like to make changes #}
;
; {{ cfg.AUTOGEN_MSG }}
; {{ cfg.AUTOGEN_DATE }}
;

[env:wi_se]
platform = {{ cfg.platform }}
board = {{ cfg.board_type }}
framework = arduino
board_build.f_cpu = {{ cfg.cpu_freq }}
board_build.f_flash = 80000000L

{% if cfg.board_mcu == 'esp8266' %}
board_build.ldscript = {{ cfg.build_ldscript }}
{% else %}
board_build.partitions = partitions_esp32.csv
{% endif %}

build_unflags =
    -Os
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH
    -D ARDUINOJSON_USE_LONG_LONG=1
{% if cfg.atomic_ota %}
    -D ATOMIC_FS_UPDATE=1
{% endif %}
    -D LOCAL_VERSION={{ cfg.local_version }}
    -O3
    # Suppress warning: 'SPIFFS' is deprecated
    -Wno-deprecated-declarations
{% if cfg.build_legacy_lib %}
    -D LEGACY_LIB=1
{% endif %}
{% if cfg.upload_protocol == "serial" %}
upload_speed = {{ cfg.serial_baud }}
upload_port = {{ cfg.serial_port }}
{% elif cfg.upload_protocol == "ota" %}
upload_protocol = espota
upload_port = {{ cfg.ota_address }}
upload_flags =
    --port=8266
{% if cfg.ota_host_port %}
    # Allow host_port/tcp in firewall - the ESP connects to it to download the firmware
    --host_port={{ cfg.ota_host_port }}
{% endif %}
    --auth={{ cfg.ota_password }}
{% endif %}
lib_deps =
{% if cfg.build_legacy_lib %}
	ESPAsyncWebServer=https://github.com/Depau/ESPAsyncWebServer/archive/wi-se-patches.zip
{% else %}
    ESP32Async/ESPAsyncWebServer
{% endif %}
{% if cfg.board_mcu == 'esp8266' %}
	ESP8266WiFi
{% endif %}
	ArduinoJson

build_type = {{ cfg.build_type }}
monitor_speed = {{ cfg.serial_debug_baud }}
monitor_filters = {{ cfg.exception_decoder }}